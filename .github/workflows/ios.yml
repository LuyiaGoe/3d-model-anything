name: Build iOS App (HouseCapture)

on:
  workflow_dispatch:      # 手动触发：仓库 Actions 页面点 "Run workflow"
  push:
    branches: [main]
    paths:
      - 'apps/house-capture/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-26    # 必须：源码使用 iOS 26 "Liquid Glass" API（glassEffect），需要 Xcode 26+ 的 SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build (unsigned, Release, real device slice)
        working-directory: apps/house-capture
        run: |
          xcodebuild -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R apps/house-capture/build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry HouseCapture-unsigned.ipa Payload
          ls -lh HouseCapture-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: HouseCapture-unsigned.ipa
